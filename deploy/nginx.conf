# Memorare candidate app — reverse proxy + SSL termination.
# Install to /etc/nginx/sites-available/ and symlink into sites-enabled/.
# Replace HOSTNAME with the assigned host.

# Sign-in redirects trigger an OTP email upstream, so cap how fast one address
# can ask for them. Zone is shared across workers; 10m holds ~160k addresses.
limit_req_zone $binary_remote_addr zone=auth:10m rate=12r/m;

# Redirect all plain HTTP to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name HOSTNAME;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name HOSTNAME;

  ssl_certificate     /etc/letsencrypt/live/HOSTNAME/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/HOSTNAME/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Inherited by both location blocks below, neither of which sets its own.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # DEMO ONLY. Exposes the browser-facing endpoints of the local mock IdP
  # (mock/idp.js) so the authorize redirect works from a real browser.
  # Delete this block when AUTH_BASE points at https://auth.memorare.ai.
  location /mock-idp/ {
    proxy_pass http://127.0.0.1:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Next.js listens on loopback only; nginx is the sole public entry point.
  # Avatars are capped at 2MB in the app. Allow a little more through so the
  # app answers with its own JSON error instead of nginx's HTML 413.
  client_max_body_size 3m;

  location = /healthz {
    proxy_pass http://127.0.0.1:3000;
    access_log off;
  }

  location /api/auth/ {
    limit_req zone=auth burst=8 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Required. Without this Next.js builds http:// absolute URLs, the
    # redirect_uri stops matching the registered value, and OAuth fails.
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
